version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gosec
    - makezero
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - usetesting
  settings:
    gosec:
      excludes:
        # Paths come from the operator's own flags and environment.
        - G304
  exclusions:
    presets:
      # Close, Flush, os.Remove and fmt.Fprint* results on best-effort paths.
      - std-error-handling
    rules:
      # Tests stand up deliberately weak servers and world-readable fixtures.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
