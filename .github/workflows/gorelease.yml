name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # pkgbuild only exists on macOS, so the installer is built here and handed
  # to the release job. This job never holds a write token.
  macos-pkg:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Harden-Runner supports audit mode only on macOS runners.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history and tags, so the Go toolchain stamps the binary with the
      # release tag, as it does for the GoReleaser builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build the macOS arm64 installer
        run: make pkg-darwin-arm64 VERSION="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pkg
          path: build/pkg/*.pkg
          if-no-files-found: error
          retention-days: 1

  release:
    name: GoReleaser
    needs: macos-pkg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            goreleaser.com:443
            proxy.golang.org:443
            sum.golang.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # build/ is ignored by git, so the download leaves the tree clean for
      # GoReleaser. .goreleaser.yaml picks the installer up from this path.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-pkg
          path: build/pkg

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
