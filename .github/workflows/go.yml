name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Harden the runner (Block unexpected outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          github.com:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          proxy.golang.org:443
          sum.golang.org:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14.0
        skip-cache: true

    - name: Check go.mod is tidy
      run: make tidy-check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    # Audit, not block: the tests resolve a hostname that must not exist, and
    # block mode answers unknown names with a sinkhole address.
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false

    - name: Build
      run: make build

    - name: Test
      run: go test -race -mod=readonly -v ./...

    - name: Vet
      run: go vet -mod=readonly ./...

  package:
    name: Snapshot packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Harden the runner (Block unexpected outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          github.com:443
          raw.githubusercontent.com:443
          goreleaser.com:443
          proxy.golang.org:443
          sum.golang.org:443
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false

    - name: Check the GoReleaser config
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: '~> v2'
        args: check

    - name: Build snapshot packages
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: '~> v2'
        args: release --snapshot --clean
